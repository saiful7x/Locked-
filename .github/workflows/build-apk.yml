name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          if [ -f "android-app/settings.gradle.kts" ]; then
            cd android-app
            gradle assembleDebug --no-daemon
          elif [ -f "saiful-lock-ai-android-github.zip" ]; then
            unzip -o saiful-lock-ai-android-github.zip -x ".github/*"
            gradle assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Locate Debug APK
        id: find_apk
        run: |
          if [ -f "android-app/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "apk_path=android-app/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
          else
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_OUTPUT
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: saiful-lock-ai-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
